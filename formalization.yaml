fidelity:
  divergences: >-
    A circuit is a list of gates and an output wire. A wire is an input, a constant or a gate
    number, and a wire that names a gate not yet computed reads false, so every list of gates is
    a circuit and computes what the circuit with that wire replaced by the constant false
    computes, with the same size. A Boolean function of n variables is its own truth table: a
    circuit with inputs indexed by Fin n → Bool reads 2^n bits. Constructivity asks for circuits
    of size 2^(c n) for all n ≥ n₀ (the paper's P/poly-constructivity, size polynomial in 2^n),
    and largeness asks for a fraction 2^(-c n) for all n ≥ n₀ (the paper's 2^(-O(n))). Usefulness
    against P/poly is stated uniformly: for every d, for all large n, every function in C_n has
    circuit size more than n^d. This is equivalent to the paper's Section 2.2 form (every
    sequence with f_n ∈ C_n infinitely often is outside P/poly), and to the Section 2.1 form
    (every sequence with f_n ∈ C_n for all n has super-polynomial size) when every C_n is
    nonempty. The Section 2.1 form read literally holds vacuously when some C_n is empty. With
    it, the property of all functions of at least one variable would be natural and useful, and
    the theorem would fail whenever a generator meeting its hypothesis exists. A generator in P/poly has a circuit of size k^c + c for each
    output bit. The hypothesis of the theorem is the negation of the paper's "H(G_k) ≤
    2^(k^o(1)) for every generator in P/poly": some generator in P/poly and some ε > 0 with
    H(G_k) ≥ 2^(k^ε) for infinitely many k. Hardness follows the paper's definition (the least
    S such that a circuit of size at most S has advantage at least 1/S), stated as a lower
    bound on S with probabilities as counts over the uniform distribution.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The kernel checks the proof, which uses only propext, Classical.choice and Quot.sound. The
    local comparator run (lake comparator --paranoid) accepted the solution with the Lean,
    lean4lean, nanoda, con-leche and con-ron kernels. The statement and its definitions were
    compared by the agent with the text of the paper. NaturalProofs/Sanity.lean shows that the
    property of all functions is natural, that the empty property is useful against P/poly,
    and that the all-zero generator has hardness below 3. Independent mathematical review has
    not taken place.

