related_formalizations:
  - id: "https://github.com/crabsatellite/lean4-natural-proofs-barrier"
    relationship: independent
    note: >-
      A Lean 4 development (May 2026). Its hypothesis PRFHypothesis assumes that every
      constructive and large property accepts some output of the generator at arbitrarily large
      input lengths, which is the step that the distinguisher argument proves here.
  - id: "https://github.com/neardws/p-vs-np-lean"
    relationship: independent
    note: >-
      A Lean 4 development (October 2026) that defines natural properties and states the
      barrier as a proposition parameterized by an undefined notion of PRF security, with the
      proof pending.

status:
  scope: >-
    Formalized and registered: Theorem 4.1 of Razborov and Rudich in the form
    NaturalProofs.natural_proofs_barrier. For every generator G in P/poly and every ε > 0 such
    that the hardness of G_k is at least 2^(k^ε) for infinitely many k, there is no property
    that is P/poly-natural and useful against P/poly. Circuits are Boolean circuits over
    {¬, ∧, ∨} with fan-in at most two and constants, and size is the number of gates. The
    statement is about circuits only, so no algorithm and no running time are involved. Not
    formalized: the corollary from hard functions stated after Theorem 4.1, Theorems 4.2 and
    4.3, and Sections 3 and 5 of the paper. The cryptographic hypothesis is a hypothesis of the
    theorem and is not proved (it is an open problem).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "NaturalProofs.natural_proofs_barrier"
      file: "NaturalProofs/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

