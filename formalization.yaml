version: "v0.4"

project:
  name: "The natural proofs barrier (Razborov and Rudich)"
  description: >-
    A Lean 4 proof of Theorem 4.1 of A. A. Razborov and S. Rudich, Natural proofs (1997). If a
    generator G_k from k bits to 2k bits, computed by circuits of polynomial size, has hardness
    at least 2^(k^ε) for some ε > 0 and infinitely many k, then no P/poly-natural combinatorial
    property is useful against P/poly. The proof follows the paper. The generator gives
    Goldreich–Goldwasser–Micali functions of n variables with polynomial-size circuits, which a
    useful property must reject. The circuit that decides the large constructive subproperty
    then tells these functions apart from random functions. A hybrid argument over the levels
    of the tree and over the nodes of a level, with all other nodes fixed, gives a circuit of
    size 2^O(n) that tells one output of G_k apart from a uniform string with advantage
    2^(-O(n)), which contradicts the hardness for n a small power of k.
  authors:
    - "Z. Zzyzek (github: zzyzek)"
  license: "CC0-1.0"
  responsible_maintainers:
    - "Z. Zzyzek (github: zzyzek)"

